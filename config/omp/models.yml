providers:
  vllm:
    baseUrl: http://localhost:51901/v1
    api: openai-completions
    auth: none
    discovery:
      type: openai-models-list
  vllm-gb10:
    baseUrl: http://143.96.29.137:51901/v1
    api: openai-completions
    auth: none
    discovery:
      type: openai-models-list
  microsoft-foundry:
    # Azure AI Foundry "v1" OpenAI surface: OpenAI-shaped, Bearer-authenticated,
    # no api-version query, deployment name goes in the request `model` field.
    baseUrl: https://sponsorship-aifoundry.services.ai.azure.com/openai/v1
    api: openai-responses
    apiKey: MICROSOFT_FOUNDRY_API_KEY # resolved from ~/.omp/agent/.env
    compat:
      supportsStore: true
      supportsDeveloperRole: true
      supportsMultipleSystemMessages: true
      supportsStrictMode: true
      supportsReasoningEffort: true
      strictResponsesPairing: true
      # Deployments reject 'minimal' (supported: none/low/medium/high/xhigh/max)
      reasoningEffortMap:
        minimal: low
    models:
      - id: gpt-5.6-luna
        name: GPT-5.6 Luna (Foundry)
        reasoning: true
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        cost:
          input: 0.2
          output: 1.2
          cacheRead: 0.02
          cacheWrite: 0.25
      - id: gpt-5.6-terra
        name: GPT-5.6 Terra (Foundry)
        reasoning: true
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        cost:
          input: 2
          output: 12
          cacheRead: 0.2
          cacheWrite: 2.5
      - id: gpt-6-astra
        name: GPT-6 Astra (Foundry)
        reasoning: true
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        cost:
          input: 10
          output: 50
          cacheRead: 1
          cacheWrite: 12.5
